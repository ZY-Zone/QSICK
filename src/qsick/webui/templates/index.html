{% extends "base.html" %}
{% block title %}总览{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>总览</h1>
    <p>连接、消息、插件与原生载荷的实时状态。</p>
  </div>
  <div class="actions">
    <a class="btn ghost" href="/logs">查看日志</a>
  </div>
</div>

<section id="status" hx-get="/partials/status" hx-trigger="every 2s" hx-swap="innerHTML">
  {% include "partials/status.html" %}
</section>

<div class="grid two" style="margin-top:14px">
  <section class="card quick-card">
    <div class="card-head">
      <h2>快速测试</h2>
      <label class="quick-account">测试账户
        <select id="quick-account" aria-label="测试账户"><option value="">加载中…</option></select>
      </label>
    </div>
    <form class="quick-form" onsubmit="return qsickQuickSend(event)">
      <div class="quick-row">
        <input class="quick-group" name="group_id" value="30001" inputmode="numeric" aria-label="群号" title="群号" />
        <input class="quick-text" name="text" value="hello from QSICK" aria-label="文本" title="文本" />
        <button type="submit">发送</button>
        <button type="button" class="ghost" onclick="qsickCopy('quick-result')">复制</button>
      </div>
    </form>
    <pre id="quick-result" class="result quick-result">—</pre>
  </section>

  <section class="card">
    <div class="card-head"><h2>网络状态</h2><a class="faint" href="/network">配置 →</a></div>
    <div id="network-list" hx-get="/partials/network" hx-trigger="every 2s" hx-swap="innerHTML">
      {% include "partials/network.html" %}
    </div>
  </section>
</div>
{% endblock %}
