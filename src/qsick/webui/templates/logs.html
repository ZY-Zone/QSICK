{% extends "base.html" %}
{% block title %}日志{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>实时日志</h1>
  </div>
  <div class="actions">
    <span class="pill"><span class="dot ok" id="log-dot"></span><strong id="log-count">0</strong> 行</span>
  </div>
</div>

<section class="card">
  <div class="toolbar" style="margin-bottom:10px">
    <input id="log-search" placeholder="搜索消息或字段…" style="width:220px" />
    <select id="log-level">
      <option value="TRACE">TRACE+</option>
      <option value="DEBUG">DEBUG+</option>
      <option value="INFO" selected>INFO+</option>
      <option value="WARN">WARN+</option>
      <option value="ERROR">ERROR</option>
    </select>
    <select id="log-category">
      <option value="">全部</option>
      {% for group in groups %}
      <option value="group:{{ group.group }}" title="{{ group.categories|length }} 个分类">{{ group.label }}</option>
      {% for entry in group.categories if group.group == "plugin" %}
      <option value="{{ entry.category }}" title="{{ entry.description }}">&nbsp;&nbsp;{{ entry.category }}</option>
      {% endfor %}
      {% endfor %}
    </select>
    <span class="spacer"></span>
    <label class="check"><input type="checkbox" id="log-pause" /> 暂停</label>
    <label class="check"><input type="checkbox" id="log-autoscroll" checked /> 自动滚动</label>
    <button type="button" class="ghost sm" id="log-copy">复制</button>
    <a class="btn ghost sm" href="/api/logs/download">下载</a>
    <button type="button" class="ghost sm" id="log-clear">清空</button>
  </div>
  <div class="logview" id="logs"></div>
  <script type="application/json" id="log-seed">{{ records|tojson }}</script>
  {# category → group, so the filter can match a whole group without a round trip. #}
  <script type="application/json" id="log-groups">{{ category_groups|tojson }}</script>
</section>
{% endblock %}
